name: Build and Deploy Doxygen Docs

on:
  push:
    branches: [ jian/docs ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz wget

      - name: Get Latest Doxygen Version
        run: |
          mkdir -p .docs-build && cd .docs-build
          wget -q "https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz"
          tar -xzf "doxygen-1.18.0.linux.bin.tar.gz"
          sudo make -C doxygen-1.18.0 && cd ..
          doxygen --version

      - name: Prepare Custom Doxygen Config
        run: |
          .github/setup-docs-theme.sh

      - name: Run Doxygen
        run: |
          doxygen .docs-build/Doxyfile.merged

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./html
          publish_branch: gh-pages
          force_orphan: true
